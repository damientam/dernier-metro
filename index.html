<title>Dernier Métro</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{height:100%;margin:0;background:#0B0D12;color:#E9E7DC;
    font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  #wrap{position:relative;line-height:0}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;
    max-width:96vw;max-height:86vh;aspect-ratio:16/10;
    border:4px solid #1B3C8C;border-radius:6px;box-shadow:0 0 60px #000,0 0 22px rgba(27,60,140,.55);
    cursor:crosshair;background:#000}
  #hint{font-size:12px;letter-spacing:.12em;color:#8a8f9c;text-transform:uppercase}
  #hint b{color:#F5C518;font-weight:600}
</style>
<div id="wrap"><canvas id="s" width="960" height="600"></canvas></div>
<div id="hint"><b>ZQSD/WASD</b> se déplacer · <b>fn+←/→</b> pas latéral · <b>clic</b> tirer · <b>1-4</b> armes · <b>Tab</b> plan · <b>Maj</b> courir · <b>P</b> HD/SD</div>
<script>
'use strict';
/* ==================== DERNIER MÉTRO ====================
   FPS rétro dans les vrais plans de Montparnasse Bienvenüe et Châtelet.
   Moteur raycasting à hauteurs variables (sols/plafonds réels des stations),
   trains animés, 4 armes, 4 monstres. Aucun asset externe. */
let W=320, H=200, TS=64, HD=false;
const FOV_PLANE=0.66;
const screen=document.getElementById('s'), sctx=screen.getContext('2d');
const off=document.createElement('canvas'); off.width=W; off.height=H;
const octx=off.getContext('2d');
let img=octx.createImageData(W,H);
let buf=new Uint32Array(img.data.buffer);
let zbuf=new Float64Array(W);
sctx.imageSmoothingEnabled=false;

/* ---------- utilitaires ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function texToU32(cv){
  const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height);
  return {u32:new Uint32Array(d.data.buffer),w:cv.width,h:cv.height};
}
function mkCanvas(w,h,fn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); fn(g,w,h); return c;
}
function mkTex(fn){return texToU32(mkCanvas(TS,TS,g=>{g.scale(TS/64,TS/64);fn(g);}));}
function shade(px,f){
  if(f>=1) return px;
  if(f<0) f=0;
  const r=(px&255)*f, g=((px>>8)&255)*f, b=((px>>16)&255)*f;
  return 0xff000000|((b|0)<<16)|((g|0)<<8)|(r|0);
}

/* ---------- textures murales ---------- */
function noiseOn(g,w,h,alpha,n){
  for(let i=0;i<n;i++){
    g.fillStyle=`rgba(0,0,0,${Math.random()*alpha})`;
    g.fillRect(Math.random()*w|0,Math.random()*h|0,2,2);
  }
}
function drawTiles(g,base,grout){
  g.fillStyle=grout; g.fillRect(0,0,64,64);
  for(let y=0;y<64;y+=8){
    const o=((y/8)&1)?8:0;
    for(let x=-8;x<64;x+=16){
      g.fillStyle=base; g.fillRect(x+o+1,y+1,14,6);
      g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(x+o+1,y+1,14,1);
      g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(x+o+1,y+6,14,1);
    }
  }
  noiseOn(g,64,64,.12,60);
}
function texTile(){return mkTex(g=>drawTiles(g,'#e6e4d8','#a8a69a'));}
function texSign(name){
  return mkTex(g=>{
    drawTiles(g,'#e6e4d8','#a8a69a');
    g.fillStyle='#12244f'; g.fillRect(3,20,58,24);
    g.fillStyle='#1B3C8C'; g.fillRect(5,22,54,20);
    g.strokeStyle='#e9e7dc'; g.lineWidth=1.5; g.strokeRect(6.5,23.5,51,17);
    g.fillStyle='#fff'; g.font='bold 9px Arial'; g.textAlign='center'; g.textBaseline='middle';
    const tw=g.measureText(name).width;
    g.save(); g.translate(32,32.5);
    if(tw>48) g.scale(48/tw,1);
    g.fillText(name,0,0); g.restore();
  });
}
function texPillar(){
  return mkTex(g=>{
    g.fillStyle='#8e8e86'; g.fillRect(0,0,64,64);
    for(let x=0;x<64;x+=4){
      g.fillStyle=`rgba(0,0,0,${.05+.08*Math.abs(Math.sin(x))})`;
      g.fillRect(x,0,2,64);
    }
    g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(0,0,3,64);
    g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(61,0,3,64);
    g.fillStyle='#6f6f68'; g.fillRect(0,58,64,6); g.fillRect(0,0,64,4);
    noiseOn(g,64,64,.2,80);
  });
}
function texTrain(kind,open){ // 'tgv' | 'rer' — open : portes ouvertes en station
  return mkTex(g=>{
    if(kind==='tgv'){
      g.fillStyle='#c8ccd2'; g.fillRect(0,0,64,64);
      g.fillStyle='#9aa0a8'; g.fillRect(0,0,64,6);
      g.fillStyle='#20366e'; g.fillRect(0,18,64,22);
      g.fillStyle='#0e1626';
      for(let x=4;x<64;x+=16) g.fillRect(x,22,10,13);
      g.fillStyle='rgba(160,200,255,.35)';
      for(let x=4;x<64;x+=16) g.fillRect(x+1,23,4,11);
      g.fillStyle='#b3202a'; g.fillRect(0,44,64,3);
      g.fillStyle='#5b6068'; g.fillRect(0,54,64,10);
      g.fillStyle='#2c2f34'; g.fillRect(0,60,64,4);
      if(open){ g.fillStyle='#ffe9a8'; g.fillRect(24,18,16,40);
        g.fillStyle='#c9b070'; g.fillRect(24,18,2,40); g.fillRect(38,18,2,40); }
    }else{
      g.fillStyle='#dfe2e6'; g.fillRect(0,0,64,64);
      g.fillStyle='#153a7a'; g.fillRect(0,0,64,10);
      g.fillStyle='#0e1626';
      for(let x=3;x<64;x+=15) g.fillRect(x,16,11,16);
      g.fillStyle='rgba(160,200,255,.3)';
      for(let x=3;x<64;x+=15) g.fillRect(x+1,17,5,14);
      g.fillStyle='#b3202a'; g.fillRect(0,36,64,4);
      g.fillStyle='#8a8f96'; g.fillRect(0,52,64,12);
      g.fillStyle='#33363b'; g.fillRect(0,60,64,4);
      if(open){ g.fillStyle='#ffe9a8'; g.fillRect(23,12,18,46);
        g.fillStyle='#c9b070'; g.fillRect(23,12,2,46); g.fillRect(39,12,2,46); }
    }
    noiseOn(g,64,64,.1,40);
  });
}
function texTunnel(){ // voie vide : tunnel sombre, câbles, anneaux
  return mkTex(g=>{
    g.fillStyle='#101318'; g.fillRect(0,0,64,64);
    g.fillStyle='#181d26'; g.fillRect(0,0,64,8);
    g.strokeStyle='#232a36'; g.lineWidth=2;
    g.beginPath(); g.arc(32,70,52,Math.PI*1.15,Math.PI*1.85); g.stroke();
    g.strokeStyle='#2c333f'; g.lineWidth=1;
    g.beginPath(); g.moveTo(0,12); g.quadraticCurveTo(32,16,64,12); g.stroke();
    g.beginPath(); g.moveTo(0,18); g.quadraticCurveTo(32,21,64,18); g.stroke();
    g.fillStyle='#3a424f'; g.fillRect(0,56,64,3);
    g.fillStyle='#20252e'; g.fillRect(0,60,64,4);
    g.fillStyle='rgba(245,197,24,.5)'; g.fillRect(4,50,3,3); g.fillRect(52,48,3,3);
    noiseOn(g,64,64,.3,90);
  });
}
function texAd(){
  return mkTex(g=>{
    drawTiles(g,'#e6e4d8','#a8a69a');
    g.fillStyle='#3a3a38'; g.fillRect(4,4,56,56);
    g.fillStyle='#f2efe4'; g.fillRect(7,7,50,50);
    g.fillStyle='#F5C518'; g.beginPath(); g.arc(32,26,13,0,7); g.fill();
    g.fillStyle='#1B3C8C'; g.fillRect(12,40,40,7);
    g.fillStyle='#b3202a'; g.fillRect(12,49,26,4);
    g.fillStyle='#111'; g.font='bold 7px Arial'; g.textAlign='center';
    g.fillText('VISITEZ',32,16); g.fillText('PARIS',32,30);
  });
}
function texGate(){
  return mkTex(g=>{
    g.fillStyle='#1c1e24'; g.fillRect(0,0,64,64);
    g.fillStyle='#7d828c'; g.fillRect(2,4,14,60); g.fillRect(48,4,14,60);
    g.fillStyle='#a6abb5'; g.fillRect(2,4,14,4); g.fillRect(48,4,14,4);
    g.fillStyle='#3d424c'; g.fillRect(16,26,32,10);
    g.fillStyle='#00c46a'; g.beginPath();
    g.moveTo(26,14); g.lineTo(38,20); g.lineTo(26,26); g.fill();
    g.fillStyle='#31353d'; g.fillRect(16,40,32,20);
    g.fillStyle='#8f68b8'; g.fillRect(5,30,8,10); g.fillRect(51,30,8,10);
    noiseOn(g,64,64,.15,40);
  });
}
function texExit(label){
  return mkTex(g=>{
    g.fillStyle='#22262e'; g.fillRect(0,0,64,64);
    g.fillStyle='#0f5132'; g.fillRect(6,14,52,50);
    g.fillStyle='#146c42'; g.fillRect(9,17,46,44);
    g.fillStyle='#0a3b24'; g.fillRect(30,17,4,44);
    g.fillStyle='#1B3C8C'; g.fillRect(6,2,52,11);
    g.fillStyle='#fff'; g.font='bold 8px Arial'; g.textAlign='center'; g.textBaseline='middle';
    const tw=g.measureText(label).width;
    g.save(); g.translate(32,8); if(tw>46) g.scale(46/tw,1);
    g.fillText(label,0,0); g.restore();
    g.fillStyle='#F5C518'; g.fillRect(13,38,6,3); g.fillRect(45,38,6,3);
  });
}
function texBuffer(){
  return mkTex(g=>{
    g.fillStyle='#3a3d42'; g.fillRect(0,0,64,64);
    for(let i=-64;i<64;i+=16){
      g.fillStyle='#F5C518'; g.beginPath();
      g.moveTo(i,44); g.lineTo(i+8,44); g.lineTo(i+28,64); g.lineTo(i+20,64); g.fill();
    }
    g.fillStyle='#26282c'; g.fillRect(0,0,64,10);
    g.fillStyle='#b3202a'; g.beginPath(); g.arc(16,22,5,0,7); g.fill();
    g.beginPath(); g.arc(48,22,5,0,7); g.fill();
    noiseOn(g,64,64,.2,60);
  });
}
function texDir(){
  return mkTex(g=>{
    drawTiles(g,'#e6e4d8','#a8a69a');
    g.fillStyle='#f4f2ea'; g.fillRect(2,22,60,20);
    g.strokeStyle='#1B3C8C'; g.lineWidth=2; g.strokeRect(3,23,58,18);
    g.fillStyle='#1B3C8C'; g.font='bold 8px Arial'; g.textAlign='center';
    g.fillText('↦ SORTIE',32,31);
    g.fillStyle='#b3202a'; g.font='bold 6px Arial';
    g.fillText('CORRESPONDANCE',32,39);
  });
}
function texFloor(warm){
  return mkTex(g=>{
    const base=warm?'#7a746a':'#6e7076', grout=warm?'#5c574f':'#53555b';
    g.fillStyle=grout; g.fillRect(0,0,64,64);
    for(let y=0;y<64;y+=16)for(let x=0;x<64;x+=16){
      g.fillStyle=base; g.fillRect(x+1,y+1,14,14);
      g.fillStyle='rgba(255,255,255,.07)'; g.fillRect(x+1,y+1,14,2);
    }
    noiseOn(g,64,64,.25,180);
  });
}
function texCeil(){
  return mkTex(g=>{
    g.fillStyle='#23252c'; g.fillRect(0,0,64,64);
    g.fillStyle='#191b20'; g.fillRect(0,0,64,4); g.fillRect(0,60,64,4);
    g.fillStyle='#e9e6d2'; g.fillRect(26,6,12,52);
    g.fillStyle='#fffbe0'; g.fillRect(29,6,6,52);
    noiseOn(g,64,64,.2,60);
  });
}

/* ---------- sprites ---------- */
function mkSpr(fn){return texToU32(mkCanvas(TS,TS,g=>{g.scale(TS/64,TS/64);fn(g);}));}
/* uniformes d'après les vraies tenues : SNCF marine/rouge/casquette, RATP vert/turquoise */
const UNIF={
  sncf:{jacket:'#1d2440',jacket2:'#151a30',pipe:'#c8102e',shirt:'#e8ecf2',tie:'#c8102e',
    cap:'#161c36',capBand:'#c8102e',hair:null,pants:'#1a2038'},
  ratp:{jacket:'#28443a',jacket2:'#1d332c',pipe:'#3ec8b4',shirt:'#eef0ea',tie:null,
    cap:null,capBand:null,hair:'#241f1a',pants:'#233830'},
};
function drawGhoul(g,pose,style){
  const U=UNIF[style]||UNIF.sncf;
  g.clearRect(0,0,64,64);
  if(pose===6){
    g.fillStyle='rgba(30,60,20,.85)'; g.beginPath(); g.ellipse(32,58,20,5,0,0,7); g.fill();
    g.fillStyle=U.jacket; g.beginPath(); g.ellipse(24,55,7,4,0,0,7); g.fill();
    if(U.cap){ g.fillStyle=U.cap; g.fillRect(38,52,10,4); g.fillStyle=U.capBand; g.fillRect(38,54,10,1); }
    return;
  }
  g.save();
  if(pose===5){ g.translate(10,26); g.rotate(1.1); }
  else if(pose===4){ g.translate(4,8); g.rotate(.45); }
  const leg=pose===1?4:0;
  g.fillStyle=U.pants;
  g.fillRect(24,44+(pose===2?2:0),6,18-leg);
  g.fillRect(34,44+(pose===2?2:0),6,18-(4-leg));
  g.fillStyle='#111318'; g.fillRect(23,60-leg,8,3); g.fillRect(33,56+leg,8,3);
  g.fillStyle=U.jacket; g.fillRect(20,26,24,20);
  g.fillStyle=U.jacket2; g.fillRect(20,42,24,4); g.fillRect(31,26,2,20);
  g.fillStyle=U.pipe; g.fillRect(20,29,24,1.5);
  g.fillStyle=U.shirt; g.beginPath(); g.moveTo(28,26); g.lineTo(36,26); g.lineTo(32,33); g.fill();
  if(U.tie){ g.fillStyle=U.tie; g.fillRect(31,27,2,7); }
  g.fillStyle=U.jacket;
  if(pose===2){ g.fillRect(10,20,12,5); g.fillRect(42,20,12,5);
    g.fillStyle='#7ec46a'; g.fillRect(8,18,5,8); g.fillRect(51,18,5,8); }
  else { g.fillRect(14,30,8,14); g.fillRect(42,30,8,14);
    g.fillStyle='#5d9448'; g.fillRect(15,42,6,4); g.fillRect(43,42,6,4); }
  g.fillStyle=pose===3?'#b9e6a8':'#5d9448';
  g.beginPath(); g.arc(32,17,10,0,7); g.fill();
  if(U.cap){
    g.fillStyle=U.cap; g.beginPath(); g.ellipse(32,10,11,5,0,0,7); g.fill();
    g.fillRect(21,9,22,4);
    g.fillStyle=U.capBand; g.fillRect(21,12,22,1.5);
    g.fillStyle='#0c101f'; g.fillRect(22,13.5,20,2.5);
  } else if(U.hair){
    g.fillStyle=U.hair; g.beginPath(); g.ellipse(32,10,10,5,0,0,7); g.fill();
    g.fillRect(23,8,4,5); g.fillRect(30,6,4,5); g.fillRect(37,8,4,4);
  }
  g.fillStyle='#ffe14a';
  g.fillRect(26,15,4,3); g.fillRect(34,15,4,3);
  g.fillStyle='#b3202a'; g.fillRect(28,23,8,2);
  if(pose===2){ g.fillRect(27,22,10,4); g.fillStyle='#fff';
    g.fillRect(28,22,2,2); g.fillRect(34,22,2,2); }
  g.restore();
}
function drawSpectre(g,pose){
  g.clearRect(0,0,64,64);
  const bob=pose===1?2:0, fade=pose>=4?(pose-3)*.3:0;
  g.globalAlpha=1-fade;
  g.save(); g.translate(0,bob);
  if(pose>=4){ g.translate(32,32); g.scale(1-(pose-3)*.22,1-(pose-3)*.22); g.translate(-32,-32); }
  g.fillStyle=pose===3?'#6a6a9a':'#181826';
  g.beginPath();
  g.moveTo(32,4); g.quadraticCurveTo(52,14,50,36);
  g.quadraticCurveTo(54,50,46,56); g.lineTo(42,48); g.lineTo(38,58);
  g.lineTo(32,50); g.lineTo(26,58); g.lineTo(22,48); g.lineTo(18,56);
  g.quadraticCurveTo(10,50,14,36); g.quadraticCurveTo(12,14,32,4); g.fill();
  g.fillStyle='rgba(90,90,140,.4)';
  g.beginPath(); g.moveTo(32,6); g.quadraticCurveTo(46,16,44,34);
  g.lineTo(20,34); g.quadraticCurveTo(18,16,32,6); g.fill();
  g.fillStyle='#000'; g.beginPath(); g.ellipse(32,20,9,11,0,0,7); g.fill();
  g.fillStyle='#ff3b30';
  g.fillRect(27,18,4,3); g.fillRect(33,18,4,3);
  g.fillStyle='rgba(255,80,60,.5)';
  g.fillRect(26,17,6,5); g.fillRect(32,17,6,5);
  if(pose===2){ g.fillStyle='#ff8c1a'; g.beginPath(); g.arc(32,30,5,0,7); g.fill();
    g.fillStyle='#ffe14a'; g.beginPath(); g.arc(32,30,2.5,0,7); g.fill(); }
  g.restore(); g.globalAlpha=1;
}
function drawRat(g,pose){ // rat des tunnels — vue de profil
  g.clearRect(0,0,64,64);
  if(pose===6){ g.fillStyle='rgba(90,40,30,.8)'; g.beginPath(); g.ellipse(32,59,16,4,0,0,7); g.fill(); return; }
  g.save();
  if(pose>=4){ g.translate(32,54); g.rotate(pose===4?.6:2.6); g.translate(-32,-54); }
  const leg=pose===1?3:0;
  // queue
  g.strokeStyle='#b98a78'; g.lineWidth=2.5; g.beginPath();
  g.moveTo(12,50); g.quadraticCurveTo(2,46,6,38); g.stroke();
  // corps
  g.fillStyle=pose===3?'#c9a08a':'#6b5648';
  g.beginPath(); g.ellipse(30,49,19,10,0,0,7); g.fill();
  g.fillStyle='#57453a'; g.beginPath(); g.ellipse(30,45,16,6,0,0,7); g.fill();
  // tête
  g.fillStyle=pose===3?'#c9a08a':'#75604f';
  g.beginPath(); g.moveTo(44,42); g.lineTo(60,50); g.lineTo(44,57); g.fill();
  // oreilles
  g.fillStyle='#8a7060'; g.beginPath(); g.arc(45,40,4,0,7); g.fill();
  g.beginPath(); g.arc(51,42,3.5,0,7); g.fill();
  // pattes
  g.fillStyle='#57453a';
  g.fillRect(20,56+leg,4,6-leg); g.fillRect(30,56,4,6); g.fillRect(40,56-leg,4,6+leg);
  // œil rouge + dents
  g.fillStyle='#ff3b30'; g.fillRect(50,46,3,3);
  g.fillStyle='#fff'; g.beginPath(); g.moveTo(58,50); g.lineTo(60,54); g.lineTo(56,52); g.fill();
  if(pose===2){ g.fillStyle='#b3202a'; g.beginPath(); g.moveTo(56,48); g.lineTo(63,51); g.lineTo(56,55); g.fill();
    g.fillStyle='#fff'; g.fillRect(56,48,2,2); g.fillRect(56,52,2,2); }
  g.restore();
}
function drawCtrl(g,pose){ // contrôleur spectral — grand, képi, composteur luisant
  g.clearRect(0,0,64,64);
  if(pose===6){ g.fillStyle='rgba(20,26,50,.9)'; g.beginPath(); g.ellipse(32,58,20,5,0,0,7); g.fill();
    g.fillStyle='#10142a'; g.beginPath(); g.ellipse(40,55,8,4,0,0,7); g.fill();
    g.fillStyle='#c8102e'; g.fillRect(20,53,12,2); return; }
  g.save();
  if(pose===5){ g.translate(8,22); g.rotate(.9); }
  else if(pose===4){ g.translate(2,6); g.rotate(.3); }
  const leg=pose===1?4:0;
  // jambes longues
  g.fillStyle='#10142a';
  g.fillRect(23,40,7,22-leg); g.fillRect(34,40,7,22-(4-leg));
  g.fillStyle='#0a0d1c'; g.fillRect(22,59-leg,9,3); g.fillRect(33,55+leg,9,3);
  // grand manteau marine
  g.fillStyle=pose===3?'#4a5490':'#141a36'; g.beginPath();
  g.moveTo(18,20); g.lineTo(46,20); g.lineTo(48,44); g.lineTo(16,44); g.fill();
  g.fillStyle='#0e1226'; g.fillRect(31,20,2,24);
  g.fillStyle='#c8102e'; g.fillRect(18,23,28,1.5); // liseré rouge
  g.fillStyle='#d4af37'; g.fillRect(20,26,3,2); g.fillRect(41,26,3,2); // boutons dorés
  g.fillRect(20,32,3,2); g.fillRect(41,32,3,2);
  // bras : gants blancs
  g.fillStyle='#141a36';
  if(pose===2){ g.fillRect(44,14,14,5); g.fillStyle='#e8ecf2'; g.fillRect(56,12,6,8);
    // composteur luisant
    g.fillStyle='#ff8c1a'; g.beginPath(); g.arc(60,10,6,0,7); g.fill();
    g.fillStyle='#ffe14a'; g.beginPath(); g.arc(60,10,3,0,7); g.fill();
    g.fillStyle='#141a36'; g.fillRect(8,24,10,5); }
  else { g.fillRect(12,22,8,16); g.fillRect(44,22,8,16);
    g.fillStyle='#e8ecf2'; g.fillRect(13,36,6,5); g.fillRect(45,36,6,5); }

function heightAt(x,y){
  const gx=clamp(x-.5,0,MW-1.001), gy=clamp(y-.5,0,MH-1.001);
  const x0=gx|0, y0=gy|0, x1=Math.min(MW-1,x0+1), y1=Math.min(MH-1,y0+1);
  const ax=gx-x0, ay=gy-y0;
  const h00=fh[y0*MW+x0], h10=fh[y0*MW+x1], h01=fh[y1*MW+x0], h11=fh[y1*MW+x1];
  return (h00*(1-ax)+h10*ax)*(1-ay)+(h01*(1-ax)+h11*ax)*ay;
}

function loadLevel(idx){
  const L=LEVELS[idx];
  MH=L.map.length; MW=L.map[0].length;
  grid=new Uint8Array(MW*MH);
  fh=new Float32Array(MW*MH); ch=new Float32Array(MW*MH);
  enemies=[]; items=[]; fires=[]; corpses=[]; msgs=[]; kills=0;
  for(let y=0;y<MH;y++){
    const row=L.map[y], hrow=L.hm[y], crow=L.cm[y];
    for(let x=0;x<MW;x++){
      const c=row[x], i=y*MW+x;
      const hv=parseInt(hrow[x],16)/4;
      fh[i]=hv; ch[i]=hv+parseInt(crow[x],16)/4;
      if(WALLCODE[c]){ grid[i]=WALLCODE[c]; continue; }
      const cx=x+.5, cy=y+.5;
      if(c==='@'){ P.x=cx; P.y=cy; }
      else if(c==='z') enemies.push(mkEnemy('ghoul',cx,cy));
      else if(c==='i') enemies.push(mkEnemy('spectre',cx,cy));
      else if(c==='r') enemies.push(mkEnemy('rat',cx,cy));
      else if(c==='c') enemies.push(mkEnemy('controleur',cx,cy));
      else if(c==='m') items.push({x:cx,y:cy,kind:'medkit'});
      else if(c==='a') items.push({x:cx,y:cy,kind:'ammo'});
      else if(c==='n') items.push({x:cx,y:cy,kind:'navigo'});
      else if(c==='w') items.push({x:cx,y:cy,kind:'shotgun'});
      else if(c==='u') items.push({x:cx,y:cy,kind:'smg'});
    }
  }
  totalEnemies=enemies.length;
  placeVials();
  buildTrainGroups();
  rebuildTex(); buildSprites(L.agent);
  let bestA=0,bestD=-1;
  for(let k=0;k<16;k++){
    const a=k*Math.PI/8, r=castRay(P.x,P.y,Math.cos(a),Math.sin(a),40).dist;
    if(r>bestD){ bestD=r; bestA=a; }
  }

}
/* Fioles de vitalité : rangées alignées dans les couloirs, réapparition 20 s après ramassage. */
function placeVials(){
  let lines=0;
  const hash=(x,y)=>((x*73856093)^(y*19349663))>>>0;
  for(let y=1;y<MH-1&&lines<9;y++)for(let x=1;x<MW-7&&lines<9;x++){
    if(hash(x,y)%29) continue;
    let ok=true;
    for(let k=0;k<7;k++) if(cell(x+k,y)!==0){ ok=false; break; }
    if(!ok) continue;
    for(let k=1;k<6;k++) items.push({x:x+k+.5,y:y+.5,kind:'vial',respawn:0});
    lines++; x+=9;
  }
  for(let x=1;x<MW-1&&lines<16;x++)for(let y=1;y<MH-7&&lines<16;y++){
    if(hash(y,x)%31) continue;
    let ok=true;
    for(let k=0;k<7;k++) if(cell(x,y+k)!==0){ ok=false; break; }
    if(!ok) continue;
    for(let k=1;k<6;k++) items.push({x:x+.5,y:y+k+.5,kind:'vial',respawn:0});
    lines++; y+=9;
  }
}
function buildTrainGroups(){
  tgrid=new Int16Array(MW*MH).fill(-1);
  trainGroups=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const i=y*MW+x;
    if(grid[i]!==4||tgrid[i]>=0) continue;
    const id=trainGroups.length, cells=[];
    const dq=[[x,y]]; tgrid[i]=id;
    while(dq.length){
      const [cx,cy]=dq.pop(); cells.push([cx,cy]);
      for(let dy2=-1;dy2<=1;dy2++)for(let dx2=-1;dx2<=1;dx2++){
        const nx=cx+dx2, ny=cy+dy2;
        if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
        const j=ny*MW+nx;
        if(grid[j]===4&&tgrid[j]<0){ tgrid[j]=id; dq.push([nx,ny]); }
      }
    }
    let sx=0,sy=0;
    for(const [cx,cy] of cells){ sx+=cx; sy+=cy; }
    trainGroups.push({cx:sx/cells.length+.5, cy:sy/cells.length+.5,
      phase:(id*7.31)%34, scroll:Math.random()*8, state:'absent', prev:'absent'});

function tryMove(o,nx,ny,r){
  if(!solid(nx-r,o.y-r)&&!solid(nx+r,o.y-r)&&!solid(nx-r,o.y+r)&&!solid(nx+r,o.y+r)) o.x=nx;
  if(!solid(o.x-r,ny-r)&&!solid(o.x+r,ny-r)&&!solid(o.x-r,ny+r)&&!solid(o.x+r,ny+r)) o.y=ny;
}
function castRay(ox,oy,dx,dy,max){
  let mapX=ox|0, mapY=oy|0;
  const ddx=dx===0?1e30:Math.abs(1/dx), ddy=dy===0?1e30:Math.abs(1/dy);
  let stepX,stepY,sdx,sdy;
  if(dx<0){stepX=-1;sdx=(ox-mapX)*ddx;}else{stepX=1;sdx=(mapX+1-ox)*ddx;}
  if(dy<0){stepY=-1;sdy=(oy-mapY)*ddy;}else{stepY=1;sdy=(mapY+1-oy)*ddy;}
  let side=0,dist=0;
  for(let i=0;i<420;i++){
    if(sdx<sdy){ dist=sdx; sdx+=ddx; mapX+=stepX; side=0; }
    else { dist=sdy; sdy+=ddy; mapY+=stepY; side=1; }
    if(dist>max) return {dist:max,hit:0};
    const c=cell(mapX,mapY);
    if(c>0) return {dist,hit:c,side,mapX,mapY};
  }
  return {dist:max,hit:0};
}
function hasLOS(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, d=Math.hypot(dx,dy);
  if(d<.001) return true;
  return castRay(x0,y0,dx/d,dy/d,d).dist>=d-.05;
}

}

}

  if(!AC) return;
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(), t=AC.currentTime+(delay||0);
  s.buffer=noiseBuf; s.loop=true; f.type='lowpass'; f.frequency.value=cutoff; f.Q.value=q||0;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur);
}

/* ---------- logique ---------- */
function fireWeapon(){
  if(P.cool>0) return;
  const Wd=WEAPONS[P.weapon];
  if(Wd.melee){
    P.cool=Wd.cool; P.fireT=0; SND.wrench();
    let best=null, bd=1e9;
    for(const e of enemies){
      if(e.state==='dying') continue;
      const dx=e.x-P.x, dy=e.y-P.y, d=Math.hypot(dx,dy);
      if(d<Wd.range&&(dx*P.dx+dy*P.dy)/Math.max(d,.01)>.45&&d<bd){ bd=d; best=e; }
    }
    if(best){ SND.clang(); hitEnemy(best,Wd.dmg,P.dx,P.dy); }
    return;
  }
  if(P[Wd.ammo]<=0){
    msg(Wd.ammo==='shells'?'Plus de cartouches !':'Plus de balles — la clé, en dernier recours (1).');
    P.cool=.4; return;
  }
  P.cool=Wd.cool; P.fireT=0;
  let pellets=Wd.pellets;
  if(Wd.double){ // les deux canons partent ensemble (ou un seul s'il ne reste qu'une cartouche)
    const n=Math.min(2,P[Wd.ammo]);
    P[Wd.ammo]-=n; pellets=6*n;
    SND.shotgun(); if(n===2) SND.shotgun();
  } else {
    P[Wd.ammo]--;
    (P.weapon===3?SND.smg:SND.pistol)();
  }
  const spreadEff=Wd.spread*(1+P.bloom);
  P.bloom=Math.min(3,P.bloom+Wd.bloom);
  for(let i=0;i<pellets;i++){
    const spread=(Math.random()-.5)*2*spreadEff;
    const c=Math.cos(spread), s=Math.sin(spread);
    const dx=P.dx*c-P.dy*s, dy=P.dx*s+P.dy*c;
    const wall=castRay(P.x,P.y,dx,dy,40).dist;
    let best=null, bestT=1e9;
    for(const e of enemies){
      if(e.state==='dying') continue;
      const ex=e.x-P.x, ey=e.y-P.y;
      const t=ex*dx+ey*dy;
      if(t<=0||t>wall) continue;
      const perp=Math.abs(ex*dy-ey*dx);
      if(perp<.38&&t<bestT){ bestT=t; best=e; }
    }
    if(best) hitEnemy(best,Wd.dmg,dx,dy);
  }
}
function hitEnemy(e,dmg,dx,dy){
  e.hp-=dmg; e.painT=.28; e.state='chase'; e.seen=true;
  e.x+=dx*.12; e.y+=dy*.12;
  if(e.hp<=0&&e.state!=='dying'){ e.state='dying'; e.dieT=0; kills++; SND.die(); }
}
function hurtPlayer(d){
  P.hp-=d; P.hurtT=.4; SND.hurt();
  if(P.hp<=0){ P.hp=0; state='dead'; stateT=0;
    try{ document.exitPointerLock(); }catch(e){} }
}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.state==='dying'){ e.dieT+=dt; continue; }
    if(e.painT>0){ e.painT-=dt; continue; }
    e.t+=dt; e.cool-=dt;
    const M=e.M;
    const dx=P.x-e.x, dy=P.y-e.y, dist=Math.hypot(dx,dy);
    const los=dist<13&&hasLOS(e.x,e.y,P.x,P.y);
    if(los&&!e.seen){ e.seen=true; e.state='chase';
      if(e.type==='controleur') SND.whistle();
      else if(e.type==='rat'){ if(Math.random()<.6) SND.squeak(); }
      else if(Math.random()<.7) SND.growl(); }
    if(e.state==='idle'){
      if(e.t>2.5){ e.t=0; const a=Math.random()*6.28; e.wx=Math.cos(a)*.5; e.wy=Math.sin(a)*.5; }
      tryMove(e,e.x+e.wx*dt,e.y+e.wy*dt,M.rad);
      continue;
    }
    if(M.melee){
      if(dist>M.range){
        const nx=dx/dist, ny=dy/dist;
        tryMove(e,e.x+nx*e.speed*dt,e.y+ny*e.speed*dt,M.rad);
        e.attacking=false;
      } else if(e.cool<=0){
        e.attacking=true; e.cool=M.cool;
        setTimeout(()=>{ if(e.state!=='dying'&&state==='play'){
          const d2=Math.hypot(P.x-e.x,P.y-e.y);
          if(d2<M.hit) hurtPlayer(M.dmg+Math.random()*4|0);
        } e.attacking=false; },M.windup);
      }
    } else {
      const nx=dx/dist, ny=dy/dist;
      let mx=0,my=0;
      if(dist>M.keepMax){ mx=nx; my=ny; } else if(dist<M.keepMin){ mx=-nx; my=-ny; }
      const sway=Math.sin(e.t*1.7);
      mx+=-ny*sway*.6; my+=nx*sway*.6;
      tryMove(e,e.x+mx*e.speed*dt,e.y+my*e.speed*dt,M.rad);
      if(los&&e.cool<=0&&dist<12){
        e.cool=M.fireCool; e.attacking=true; SND.fireball();
        setTimeout(()=>{ e.attacking=false; },350);
        const oz=heightAt(e.x,e.y)+M.fz;
        const tz=heightAt(P.x,P.y)+.5;
        for(let b=0;b<M.burst;b++){
          const a0=Math.atan2(dy,dx)+(M.burst>1?(b-(M.burst-1)/2)*.2:0);
          const spd=e.type==='controleur'?6.2:5.5;
          const fdx=Math.cos(a0)*spd, fdy=Math.sin(a0)*spd;
          const tt=dist/spd;
          fires.push({x:e.x,y:e.y,z:oz,dx:fdx,dy:fdy,dz:(tz-oz)/Math.max(tt,.2),t:0});
        }
      }
    }
  }
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.state==='dying'&&e.dieT>.66){
      corpses.push({x:e.x,y:e.y,tex:SPR[e.type].die[2],scale:e.M.scale});
      enemies.splice(i,1);
    }
  }
}
function updateFires(dt){
  for(let i=fires.length-1;i>=0;i--){
    const f=fires[i]; f.t+=dt;
    f.x+=f.dx*dt; f.y+=f.dy*dt; f.z+=f.dz*dt;
    if(solid(f.x,f.y)||f.t>4||f.z<heightAt(f.x,f.y)+.05){ fires.splice(i,1); continue; }
    if(Math.hypot(f.x-P.x,f.y-P.y)<.45&&Math.abs(f.z-heightAt(P.x,P.y)-.5)<.9){
      hurtPlayer(10+Math.random()*5|0); fires.splice(i,1);
    }
  }
}
function updateTrains(dt){
  for(const g of trainGroups){
    const cyc=(playT+g.phase)%34;
    let st='absent', v=0;
    if(cyc>=14&&cyc<17){ st='arrive'; v=22*(1-(cyc-14)/3); }
    else if(cyc>=17&&cyc<27){ st='stop'; }
    else if(cyc>=27&&cyc<30){ st='depart'; v=22*(cyc-27)/3; }
    g.scroll+=v*dt*.15;
    if(st!==g.prev){
      const d=Math.hypot(g.cx-P.x,g.cy-P.y);
      if(d<26&&state==='play'){
        if(st==='arrive') SND.trainArrive();
        else if(st==='depart') SND.trainDepart();
      }
      g.prev=st;
    }
    g.state=st;
  }
}
function updatePickups(){
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(it.respawn>0) continue;
    if(Math.hypot(it.x-P.x,it.y-P.y)>.65) continue;
    let ok=true;
    if(it.kind==='vial'){
      if(P.hp>=100) continue;
      P.hp=Math.min(100,P.hp+4);
      it.respawn=20; P.pickT=.18; SND.vial();
      continue;
    }
    if(it.kind==='medkit'){
      if(P.hp>=100) ok=false;
      else { P.hp=Math.min(100,P.hp+30); msg('Trousse de secours (+30)'); }
    } else if(it.kind==='ammo'){
      P.bullets=Math.min(180,P.bullets+15); P.shells=Math.min(40,P.shells+4);
      msg('Munitions récupérées');
    } else if(it.kind==='navigo'){
      P.hasNavigo=true; msg('Pass Navigo trouvé ! Les portiques vous obéissent.');
    } else if(it.kind==='shotgun'){
      P.hasShotgun=true; P.shells=Math.min(40,P.shells+8); P.weapon=2;
      msg('Fusil à deux coups de la sûreté ferroviaire ! (touche 3)');
    } else if(it.kind==='smg'){
      P.hasSMG=true; P.bullets=Math.min(180,P.bullets+30); P.weapon=3;
      msg('Pistolet-mitrailleur de la sûreté ! (touche 4)');
    }
    if(ok){ items.splice(i,1); P.pickT=.25; SND.pickup(); }
  }
}
function updateGatesAndExit(dt){
  gateMsgT-=dt;
  const px=P.x|0, py=P.y|0;
  for(let y=Math.max(0,py-2);y<=Math.min(MH-1,py+2);y++)
    for(let x=Math.max(0,px-2);x<=Math.min(MW-1,px+2);x++){
      const c=grid[y*MW+x];
      const d=Math.hypot(x+.5-P.x,y+.5-P.y);
      if(c===6&&d<1.9){
        if(P.hasNavigo){ grid[y*MW+x]=0;
          if(playT-gateSndT>.3){ gateSndT=playT; SND.gate(); msg('Bip ! Portiques déverrouillés.'); } }
        else if(gateMsgT<=0){ gateMsgT=2; msg('Portique verrouillé — il faut un pass Navigo.'); }
      }
      if(c===7&&d<1.4){
        SND.exit();
        if(level<LEVELS.length-1){ level++; loadLevel(level); startIntro(); }
        else { state='win'; stateT=0; try{ document.exitPointerLock(); }catch(e){} }
        return;
      }
    }
}
function updatePlayer(dt){
  const run=keys['ShiftLeft']||keys['ShiftRight'];
  const sp=(run?4.6:3.1)*dt;
  let mx=0,my=0;
  if(keys['KeyW']||keys['ArrowUp']){ mx+=P.dx; my+=P.dy; }
  if(keys['KeyS']||keys['ArrowDown']){ mx-=P.dx; my-=P.dy; }
  if(keys['KeyA']||keys['Home']){ mx+=P.dy; my-=P.dx; }   // Début = fn+← sur Mac
  if(keys['KeyD']||keys['End']){ mx-=P.dy; my+=P.dx; }    // Fin = fn+→ sur Mac
  if(keys['ArrowLeft']) rot(-2.6*dt);
  if(keys['ArrowRight']) rot(2.6*dt);
  const l=Math.hypot(mx,my);
  if(l>0){ tryMove(P,P.x+mx/l*sp,P.y+my/l*sp,.22); P.bob+=sp*2.2; }
  P.cool-=dt; P.fireT+=dt; P.hurtT-=dt; P.pickT-=dt;
  P.bloom=Math.max(0,P.bloom-dt*2.4);
  if((mouseDown&&document.pointerLockElement===screen)||keys['ControlLeft']||keys['Space']) fireWeapon();
}
function update(dt){
  if(state==='intro'){ stateT+=dt; if(stateT>3.4||keys['Space']||keys['Enter']) state='play'; return; }
  if(state!=='play') return;
  playT+=dt; ambT-=dt;
  if(ambT<=0){ ambT=16+Math.random()*20; SND.rumble(); }
  for(const it of items) if(it.respawn>0) it.respawn-=dt;
  updatePlayer(dt); updateEnemies(dt); updateFires(dt); updateTrains(dt);
  updatePickups(); updateGatesAndExit(dt);
  for(const m of msgs) m.t-=dt;
  msgs=msgs.filter(m=>m.t>0);
}

/* ---------- rendu 3D à hauteurs variables ----------
   Marche avant→arrière par colonne : à chaque cellule on peint la
   tranche de sol et de plafond visible, les contremarches aux
   changements de hauteur, puis le mur plein qui ferme la fenêtre. */
function render3D(){
  const L=LEVELS[level], fog=L.fogR;
  buf.fill(0xff14120e);
  const eyeZ=heightAt(P.x,P.y)+.55+Math.sin(P.bob)*.02;
  const FT=FLOORT.u32, FW2=FLOORT.w, FM=FW2-1;
  const CT=CEILT.u32;
  const H2=H/2;
  const TILE=TEX[1];
  for(let x=0;x<W;x++){
    const cam=2*x/W-1;
    const rdx=P.dx+P.px*cam, rdy=P.dy+P.py*cam;
    let mapX=P.x|0, mapY=P.y|0;
    const ddx=rdx===0?1e30:Math.abs(1/rdx), ddy=rdy===0?1e30:Math.abs(1/rdy);
    let stepX,stepY,sdx,sdy;
    if(rdx<0){stepX=-1;sdx=(P.x-mapX)*ddx;}else{stepX=1;sdx=(mapX+1-P.x)*ddx;}
    if(rdy<0){stepY=-1;sdy=(P.y-mapY)*ddy;}else{stepY=1;sdy=(mapY+1-P.y)*ddy;}
    let yTop=0, yBot=H;
    let d0=.02;
    let ci=mapY*MW+mapX;
    let curF=fh[ci], curC=ch[ci];
    let guard=0, wallDist=fog;
    while(guard++<420&&yTop<yBot){
      let side, d1;
      if(sdx<sdy) side=0; else side=1;
      d1=Math.min(side===0?sdx:sdy,fog);
      // sol de la cellule courante
      if(curF<eyeZ-.01){
        const k=(eyeZ-curF)*H;
        const yFar=H2+k/d1, yNear=H2+k/Math.max(d0,.02);
        let ya=Math.max(yTop,Math.ceil(yFar)), yb=Math.min(yBot,Math.ceil(yNear));
        for(let y=ya;y<yb;y++){
          const dd=k/(y-H2);
          const wx2=P.x+rdx*dd, wy2=P.y+rdy*dd;
          const f=clamp(1-dd/fog,0,1)*.9+.06;
          buf[y*W+x]=shade(FT[((wy2*FW2)&FM)*FW2+((wx2*FW2)&FM)],f);
        }
        yBot=Math.min(yBot,Math.max(yTop,Math.ceil(yFar)));
      }
      // plafond de la cellule courante
      if(curC>eyeZ+.01){
        const k=(curC-eyeZ)*H;
        const yNear=H2-k/Math.max(d0,.02), yFar=H2-k/d1;
        let ya=Math.max(yTop,Math.ceil(yNear)), yb=Math.min(yBot,Math.ceil(yFar));
        for(let y=ya;y<yb;y++){
          const dd=k/(H2-y);
          const wx2=P.x+rdx*dd, wy2=P.y+rdy*dd;
          const f=clamp(1-dd/fog,0,1)*.77+.05;
          buf[y*W+x]=shade(CT[((wy2*FW2)&FM)*FW2+((wx2*FW2)&FM)],f);
        }
        yTop=Math.max(yTop,Math.min(yBot,Math.ceil(yFar)));
      }
      if(d1>=fog){ wallDist=fog; break; }
      // cellule suivante
      if(side===0){ sdx+=ddx; mapX+=stepX; } else { sdy+=ddy; mapY+=stepY; }
      const hit=cell(mapX,mapY);
      // coordonnée horizontale de texture sur la frontière
      let wallX=side===0?P.y+d1*rdy:P.x+d1*rdx; wallX-=wallX|0;
      const shf=(clamp(1-d1/fog,0,1)*.95+.05)*(side===1?.72:1);
      if(hit>0){
        let T=TEX[hit]||TEX[1], scrollOff=0;
        if(hit===4){
          const g=trainGroups[tgrid[mapY*MW+mapX]];
          if(g){
            if(g.state==='absent') T=TEXTUNNEL;
            else if(g.state==='stop') T=TEXTRAINOPEN;
            else { T=TEX[4]; scrollOff=(g.scroll*T.w)|0; }
          }
        }
        const tw=T.w, tm=tw-1;
        let texX=(wallX*tw)|0;
        if((side===0&&rdx<0)||(side===1&&rdy>0)) texX=tm-texX;
        texX=(texX+scrollOff)&tm;
        // le mur est ancré sur les hauteurs de la cellule d'où l'on vient
        for(let y=yTop;y<yBot;y++){
          const zw=eyeZ-(y-H2)*d1/H;
          const texY=(((curC-zw)/(curC-curF+.0001)*tw)|0)&tm;
          buf[y*W+x]=shade(T.u32[texY*tw+texX],shf);
        }
        wallDist=d1; yTop=yBot; break;
      }
      const ni=mapY*MW+mapX;
      const nF=fh[ni], nC=ch[ni];
      // contremarche montante
      if(nF>curF+.01){
        const yHi=H2+(eyeZ-nF)*H/d1, yLo=H2+(eyeZ-curF)*H/d1;
        let ya=Math.max(yTop,Math.ceil(yHi)), yb=Math.min(yBot,Math.ceil(yLo));
        const tw=TILE.w, tm=tw-1;
        let texX=(wallX*tw)|0;
        if((side===0&&rdx<0)||(side===1&&rdy>0)) texX=tm-texX;
        for(let y=ya;y<yb;y++){
          const zw=eyeZ-(y-H2)*d1/H;
          const texY=(((nF-zw)*tw)|0)&tm;
          buf[y*W+x]=shade(TILE.u32[texY*tw+texX],shf*.9);
        }
        yBot=Math.min(yBot,Math.max(yTop,Math.ceil(yHi)));
      }
      // retombée de plafond
      if(nC<curC-.01){
        const yHi=H2-(curC-eyeZ)*H/d1, yLo=H2-(nC-eyeZ)*H/d1;
        let ya=Math.max(yTop,Math.ceil(yHi)), yb=Math.min(yBot,Math.ceil(yLo));
        const tw=TILE.w, tm=tw-1;
        let texX=(wallX*tw)|0;
        if((side===0&&rdx<0)||(side===1&&rdy>0)) texX=tm-texX;
        for(let y=ya;y<yb;y++){
          const zw=eyeZ-(y-H2)*d1/H;
          const texY=(((nC-zw)*tw)|0)&tm;
          buf[y*W+x]=shade(TILE.u32[texY*tw+texX],shf*.8);
        }
        yTop=Math.max(yTop,Math.min(yBot,Math.ceil(yLo)));
      }
      curF=nF; curC=nC; d0=d1;
    }
    zbuf[x]=wallDist;
  }
  renderSprites(fog,eyeZ);
  octx.putImageData(img,0,0);
  sctx.drawImage(off,0,0,960,600);
}
function spriteList(){
  const out=[];
  for(const c of corpses) out.push({x:c.x,y:c.y,tex:c.tex,scale:c.scale,z:heightAt(c.x,c.y)});
  for(const it of items){
    if(it.respawn>0) continue;
    const tex=it.kind==='medkit'?SPR.medkit:it.kind==='ammo'?SPR.ammo:
      it.kind==='navigo'?SPR.navigo:it.kind==='smg'?SPR.smg:
      it.kind==='vial'?SPR.vial:SPR.shotgun;
    out.push({x:it.x,y:it.y,tex,scale:it.kind==='vial'?.3:.42,z:heightAt(it.x,it.y)});
  }
  for(const e of enemies){
    const S=SPR[e.type]; let tex;
    if(e.state==='dying') tex=S.die[Math.min(2,e.dieT/.22|0)];
    else if(e.painT>0) tex=S.pain;
    else if(e.attacking) tex=S.atk;
    else tex=S.walk[(performance.now()/240+e.t*7|0)&1];
    out.push({x:e.x,y:e.y,tex,scale:e.M.scale,z:heightAt(e.x,e.y)+e.M.lift});
  }
  for(const f of fires) out.push({x:f.x,y:f.y,tex:SPR.fire,scale:.3,z:f.z-.15});
  return out;
}
function renderSprites(fog,eyeZ){
  const list=spriteList();
  for(const s of list){ const dx=s.x-P.x, dy=s.y-P.y; s.d2=dx*dx+dy*dy; }
  list.sort((a,b)=>b.d2-a.d2);
  const inv=1/(P.px*P.dy-P.dx*P.py);
  const H2=H/2;
  for(const s of list){
    const sx=s.x-P.x, sy=s.y-P.y;
    const trX=inv*(P.dy*sx-P.dx*sy);
    const trY=inv*(-P.py*sx+P.px*sy);
    if(trY<=0.1) continue;
    const scrX=(W/2)*(1+trX/trY)|0;
    const hFull=Math.abs(H/trY);
    const sh=(hFull*s.scale)|0, sw=sh;
    if(sh<2) continue;
    const bottomY=H2+(eyeZ-s.z)*hFull;
    let y0=(bottomY-sh)|0, y1=bottomY|0;
    let x0=(scrX-sw/2)|0, x1=(scrX+sw/2)|0;
    const f=clamp(1-Math.sqrt(s.d2)/fog,0,1)*.95+.05;
    const T=s.tex, tw=T.w;
    for(let x=Math.max(0,x0);x<Math.min(W,x1);x++){
      if(trY>=zbuf[x]) continue;
      const texX=((x-x0)*tw/sw)|0;
      for(let y=Math.max(0,y0);y<Math.min(H,y1);y++){
        const texY=((y-y0)*tw/sh)|0;
        const px=T.u32[texY*tw+texX];
        if((px>>>24)<120) continue;
        buf[y*W+x]=shade(px,f);
      }
    }
  }
}

function steelGrad(g,x0,y0,x1,y1){

  gr.addColorStop(.5,'#565b66'); gr.addColorStop(.65,'#3a3d45');
  gr.addColorStop(1,'#101318'); return gr;

/* Fusil à deux coups : viewmodel dessiné image par image — tir des deux canons,
   puis bascule ouverte face au joueur, insertion des cartouches, fermeture. */
function drawDoubleBarrel(bob,bob2){
  const t=P.fireT;
  const rec=t<.12?(1-t/.12)*44:0;
  let u=-1, ang=0;
  if(t>=.32&&t<1.42) u=(t-.32)/1.1;                  // phase de rechargement 0..1
  if(u>=0) ang=Math.sin(Math.min(1,u*1.25)*Math.PI)*.7;
  const open=u>=0?Math.sin(Math.min(1,Math.max(0,(u-.12)/.5))*Math.PI):0; // bascule
  sctx.translate(480+bob+ang*62,600+bob2+rec+ang*30);
  sctx.rotate(ang*.42);
  sctx.scale(1.42,1.42);
  const blk='#0c0e13', mid='#2b2f38', hi='rgba(238,242,248,.8)';
  if(t<.07){ // double flash aux bouches
    for(const mx of [-17,17]){
      const g=sctx.createRadialGradient(mx,-252,2,mx,-252,30);
      g.addColorStop(0,'rgba(255,248,200,.98)'); g.addColorStop(.45,'rgba(255,175,45,.7)');
      g.addColorStop(1,'rgba(255,120,20,0)');
      sctx.fillStyle=g; sctx.beginPath(); sctx.arc(mx,-252,30,0,7); sctx.fill();
      sctx.fillStyle='rgba(255,235,160,.85)'; sctx.beginPath();
      for(let i=0;i<8;i++){ const a=i*Math.PI/4+.4, r1=i%2?26:10;
        sctx.lineTo(mx+Math.cos(a)*r1,-252+Math.sin(a)*r1); }
      sctx.fill();
    }
  }
  if(open>.4){
    // ---- bascule ouverte : les deux chambres face au joueur ----
    // canons rabattus vers l'avant-bas
    sctx.save(); sctx.translate(0,-96); sctx.rotate(-.9-open*.5);
    sctx.fillStyle=blk; sctx.beginPath(); sctx.roundRect(-30,-6,26,120,9); sctx.fill();
    sctx.beginPath(); sctx.roundRect(4,-6,26,120,9); sctx.fill();
    sctx.fillStyle=hi; sctx.fillRect(-27,0,3,108);
    sctx.restore();
    // tranche de la bascule + chambres
    sctx.fillStyle=steelGrad(sctx,-40,0,40,0);
    sctx.beginPath(); sctx.roundRect(-42,-124,84,58,10); sctx.fill();
    for(const mx of [-17,17]){
      sctx.fillStyle='#43474f'; sctx.beginPath(); sctx.arc(mx,-96,15,0,7); sctx.fill();
      sctx.fillStyle='#101318'; sctx.beginPath(); sctx.arc(mx,-96,12,0,7); sctx.fill();
      if(u>.42&&u<.88){ // cartouches glissées dans les chambres
        sctx.fillStyle='#c22f2f'; sctx.beginPath(); sctx.arc(mx,-96,10,0,7); sctx.fill();
        sctx.fillStyle='#d8b25a'; sctx.beginPath(); sctx.arc(mx,-96,5.5,0,7); sctx.fill();
        sctx.fillStyle='#8a6a2a'; sctx.beginPath(); sctx.arc(mx,-96,2.2,0,7); sctx.fill();
      } else { sctx.fillStyle='#000'; sctx.beginPath(); sctx.arc(mx,-96,9,0,7); sctx.fill(); }
    }
    // main qui insère les cartouches
    if(u>.3&&u<.85){
      const hy=-96+Math.sin((u-.3)/.55*Math.PI)*-26;
      glove(sctx,30,hy+34,22,-.6);
      if(u<.55){ sctx.fillStyle='#c22f2f';
        sctx.save(); sctx.translate(34,hy+16); sctx.rotate(.35);
        sctx.beginPath(); sctx.roundRect(-5,-16,10,22,4); sctx.fill();
        sctx.fillStyle='#d8b25a'; sctx.fillRect(-5,2,10,5); sctx.restore(); }
    }
    // poignée + main sous la bascule
    sctx.fillStyle='#4b3621'; sctx.beginPath(); sctx.roundRect(-20,-70,44,52,10); sctx.fill();
    glove(sctx,-2,-26,25,.1);
  } else {
    // ---- vue normale : deux canons jumelés vus de l'arrière ----
    sctx.fillStyle='#3a2c1c'; sctx.beginPath(); sctx.roundRect(-34,-152,68,44,10); sctx.fill(); // bois avant

    sctx.beginPath(); sctx.roundRect(-31,-266,27,122,10); sctx.fill();

    sctx.fillStyle='#000'; sctx.beginPath(); sctx.ellipse(-17,-265,6,2.6,0,0,7); sctx.fill();
    sctx.beginPath(); sctx.ellipse(17,-265,6,2.6,0,0,7); sctx.fill();
    sctx.fillStyle='#e8e4d8'; sctx.fillRect(-2,-270,4,4); // bille de visée
    // bloc de culasse + chiens jumeaux
    sctx.fillStyle=steelGrad(sctx,-36,0,36,0);

    glove(sctx,0,-128,26,0);   // main sur le bois avant
    glove(sctx,26,-42,25,-.25); // main à la poignée
  }
}
function drawWeapon(){
  if(!WEAPART) buildWeaponArt();
  const S=1.42; // échelle d'affichage des armes
  const bob=Math.sin(P.bob)*14, bob2=Math.abs(Math.cos(P.bob))*10;
  const rec=P.fireT<.1?(1-P.fireT/.1)*46:0;
  const art=WEAPART[P.weapon], cv=art.cv;
  sctx.save();
  if(P.weapon===0){ // swing de la clé
    const sw=P.fireT<.5?Math.sin(P.fireT/.5*Math.PI):0;
    sctx.translate(480+bob+70,600+40+bob2);
    sctx.rotate(-.35+sw*1.15);
    sctx.drawImage(cv,-cv.width*S/2-70,-cv.height*S-40+90,cv.width*S,cv.height*S);
    sctx.restore();
    return;
  }
  if(P.weapon===2){ drawDoubleBarrel(bob,bob2); sctx.restore(); return; }
  const ox=480-cv.width*S/2+bob, oy=600-(cv.height-(art.peek??34))*S+bob2+rec;
  if(P.fireT<.07){ // flash de bouche : cœur + étoile
    const fx2=ox+art.fx*S, fy2=oy+art.fy*S;
    const g=sctx.createRadialGradient(fx2,fy2,3,fx2,fy2,44);
    g.addColorStop(0,'rgba(255,248,200,.98)'); g.addColorStop(.4,'rgba(255,180,50,.75)');
    g.addColorStop(1,'rgba(255,120,20,0)');
    sctx.fillStyle=g; sctx.beginPath(); sctx.arc(fx2,fy2,44,0,7); sctx.fill();
    sctx.fillStyle='rgba(255,235,160,.85)';
    sctx.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4+.4, r1=i%2?40:16;
      sctx.lineTo(fx2+Math.cos(a)*r1,fy2+Math.sin(a)*r1);
    }
    sctx.fill();
  }
  sctx.drawImage(cv,ox,oy,cv.width*S,cv.height*S);
  sctx.restore();
}

    sctx.fillText('✓ PASS NAVIGO',936,y-12); }
  sctx.fillStyle='#8a8f9c'; sctx.font='700 12px Arial';
  sctx.fillText('CRÉATURES '+kills+' / '+totalEnemies,936,y+10);
}
function drawMessages(){
  sctx.textAlign='left'; sctx.font='700 16px Arial';
  let y=28;
  for(const m of msgs){
    sctx.globalAlpha=clamp(m.t,0,1);
    sctx.fillStyle='#000'; sctx.fillText(m.text,21,y+1);
    sctx.fillStyle='#F5C518'; sctx.fillText(m.text,20,y);
    y+=24;
  }
  sctx.globalAlpha=1;
}
function drawMiniMap(){
  const sc=Math.max(2,Math.min(8,Math.floor(930/MW),Math.floor(520/MH)));
  const ox=960-MW*sc-16, oy=16;
  sctx.fillStyle='rgba(5,8,14,.85)'; sctx.fillRect(ox-6,oy-6,MW*sc+12,MH*sc+12);
  for(let y2=0;y2<MH;y2++)for(let x2=0;x2<MW;x2++){
    const c=grid[y2*MW+x2];
    if(c===0){
      const hcol=Math.min(1,fh[y2*MW+x2]/3.5);
      sctx.fillStyle='rgb('+(150+hcol*90|0)+','+(148+hcol*80|0)+','+(140+hcol*60|0)+')';
      sctx.fillRect(ox+x2*sc,oy+y2*sc,sc,sc);
    }
    else if(c===7){ sctx.fillStyle='#00c46a'; sctx.fillRect(ox+x2*sc-1,oy+y2*sc-1,sc+2,sc+2); }
    else if(c===6){ sctx.fillStyle='#8f68b8'; sctx.fillRect(ox+x2*sc,oy+y2*sc,sc,sc); }
    else if(c===4){ sctx.fillStyle='#2c5cc5'; sctx.fillRect(ox+x2*sc,oy+y2*sc,sc,sc); }
  }
  for(const e of enemies){ sctx.fillStyle='#ff5347';
    sctx.fillRect(ox+e.x*sc-2,oy+e.y*sc-2,4,4); }
  for(const it of items){ sctx.fillStyle=it.kind==='navigo'?'#c9a6ff':'#F5C518';
    sctx.fillRect(ox+it.x*sc-2,oy+it.y*sc-2,4,4); }
  sctx.save(); sctx.translate(ox+P.x*sc,oy+P.y*sc);
  sctx.rotate(Math.atan2(P.dy,P.dx));
  sctx.fillStyle='#5ec46a'; sctx.beginPath();
  sctx.moveTo(6,0); sctx.lineTo(-4,-4); sctx.lineTo(-4,4); sctx.fill(); sctx.restore();
}
function drawPlate(text,cx,cy,w,h,fs){
  sctx.fillStyle='#12244f'; sctx.fillRect(cx-w/2-4,cy-h/2-4,w+8,h+8);
  sctx.fillStyle='#1B3C8C'; sctx.fillRect(cx-w/2,cy-h/2,w,h);
  sctx.strokeStyle='#E9E7DC'; sctx.lineWidth=2.5;
  sctx.strokeRect(cx-w/2+6,cy-h/2+6,w-12,h-12);
  sctx.fillStyle='#fff'; sctx.font='700 '+fs+'px "Arial Narrow",Arial,sans-serif';
  sctx.textAlign='center'; sctx.textBaseline='middle';
  sctx.fillText(text,cx,cy+2);
}

/* ---------- écrans ---------- */
function drawTitle(t){
  sctx.fillStyle='#07080d'; sctx.fillRect(0,0,960,600);
  sctx.strokeStyle='rgba(27,60,140,.5)'; sctx.lineWidth=1.5;
  for(let i=0;i<9;i++){
    const k=((t*.35+i/9)%1), s=k*k*900;
    sctx.globalAlpha=k*.8;
    sctx.strokeRect(480-s/2,300-s*.31,s,s*.62);
  }
  sctx.globalAlpha=1;
  const flicker=Math.random()<.04?.6:1;
  sctx.globalAlpha=flicker;
  drawPlate('DERNIER MÉTRO',480,190,560,96,64);
  sctx.globalAlpha=1;
  sctx.fillStyle='#8a8f9c'; sctx.font='600 17px Arial'; sctx.textAlign='center';
  sctx.fillText('Un FPS rétro dans les vraies profondeurs de Montparnasse et Châtelet',480,262);
  sctx.fillStyle='#E9E7DC'; sctx.font='14px Arial';
  const lines=['ZQSD / WASD / flèches — se déplacer · fn+←/→ (Début/Fin) — pas latéral',
    'Souris — viser · Clic — tirer · 1 clé · 2 pistolet · 3 deux-coups · 4 PM',
    'Tab — plan · Maj — courir · P — haute / basse définition',
    'Fioles rouges : +4 santé, elles réapparaissent · les rames passent encore'];
  lines.forEach((l,i)=>sctx.fillText(l,480,320+i*24));
  if((t*2|0)&1){ sctx.fillStyle='#F5C518'; sctx.font='700 22px Arial';
    sctx.fillText('CLIQUEZ POUR PRENDRE VOTRE SERVICE',480,478); }
  sctx.fillStyle='#565b66'; sctx.font='11px Arial';
  sctx.fillText('Moteur de raycasting à hauteurs variables · aucun asset externe',480,570);
}
function drawIntro(){
  render3D();
  sctx.fillStyle='rgba(5,7,12,.78)'; sctx.fillRect(0,0,960,600);
  const L=LEVELS[level];
  drawPlate(L.name,480,180,640,74,34);
  sctx.fillStyle='#E9E7DC'; sctx.font='16px Georgia,serif'; sctx.textAlign='center';
  wrapText(L.brief,480,270,620,26);
  sctx.fillStyle='#8a8f9c'; sctx.font='13px Arial';
  sctx.fillText('Espace ou Entrée pour commencer…',480,430);
}
function wrapText(text,cx,y,maxW,lh){
  const words=text.split(' '); let line='';
  for(const w2 of words){
    if(sctx.measureText(line+w2).width>maxW){ sctx.fillText(line,cx,y); y+=lh; line=w2+' '; }
    else line+=w2+' ';
  }
  sctx.fillText(line,cx,y);
}
function drawDead(){
  render3D();
  sctx.fillStyle='rgba(120,10,10,.45)'; sctx.fillRect(0,0,960,600);
  sctx.fillStyle='rgba(0,0,0,.55)'; sctx.fillRect(0,0,960,600);
  sctx.fillStyle='#ff5347'; sctx.font='900 72px "Arial Narrow",Arial'; sctx.textAlign='center';
  sctx.fillText('SERVICE TERMINÉ',480,260);
  sctx.fillStyle='#E9E7DC'; sctx.font='18px Georgia,serif';
  sctx.fillText('Les couloirs ont eu raison de vous.',480,320);
  sctx.fillStyle='#F5C518'; sctx.font='700 20px Arial';
  sctx.fillText('ENTRÉE — reprendre le service',480,390);
}
function drawWin(){
  sctx.fillStyle='#07080d'; sctx.fillRect(0,0,960,600);
  drawPlate('TERMINUS',480,180,460,90,58);
  sctx.fillStyle='#E9E7DC'; sctx.font='18px Georgia,serif'; sctx.textAlign='center';
  sctx.fillText('Le dernier RER s\'éloigne dans le tunnel. Vous êtes à bord.',480,300);
  sctx.fillText('Paris dort. Les créatures attendront demain soir.',480,330);
  sctx.fillStyle='#F5C518'; sctx.font='700 17px Arial';
  const mm=(playT/60|0), ss=(playT%60|0);
  sctx.fillText('Créatures éliminées : '+kills+' / '+totalEnemies+'   ·   Temps : '+
    mm+' min '+(ss<10?'0':'')+ss+' s',480,400);
  sctx.fillStyle='#8a8f9c'; sctx.font='14px Arial';
  sctx.fillText('ENTRÉE — retour au titre',480,460);
}

/* ---------- boucle ---------- */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  update(dt);
  if(state==='title') drawTitle(now/1000);
  else if(state==='intro') drawIntro();
  else if(state==='dead') drawDead();
  else if(state==='win') drawWin();
  else {
    render3D();
    drawWeapon();
    hudBar();
    drawMessages();
    sctx.strokeStyle='rgba(233,231,220,.8)'; sctx.lineWidth=2;
    sctx.beginPath(); sctx.moveTo(480-8,274); sctx.lineTo(480-3,274);
    sctx.moveTo(480+3,274); sctx.lineTo(480+8,274);
    sctx.moveTo(480,274-8); sctx.lineTo(480,274-3);
    sctx.moveTo(480,274+3); sctx.lineTo(480,274+8); sctx.stroke();
    if(P.hurtT>0){ sctx.fillStyle=`rgba(179,32,42,${P.hurtT*.8})`; sctx.fillRect(0,0,960,600); }
    if(P.pickT>0){ sctx.fillStyle=`rgba(245,197,24,${P.pickT*.5})`; sctx.fillRect(0,0,960,600); }
    if(mapView) drawMiniMap();
  }
  requestAnimationFrame(frame);
}
/* démarrage : ?lvl=2 pour tester le niveau 2 */
const qlvl=new URLSearchParams(location.search).get('lvl');
loadLevel(qlvl?clamp(qlvl-1,0,LEVELS.length-1):0);
if(qlvl){ level=clamp(qlvl-1,0,LEVELS.length-1); state='intro'; }
requestAnimationFrame(frame);
</script>
